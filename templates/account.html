<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Account Configuration - My AI Companion</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <!-- Local styles & scripts -->
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet"/>
    <script>
        window.userThemePreference = "{{ theme_preference }}";
    </script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
</head>
<body class="bg-background text-on-background selection:bg-primary/30 min-h-screen">
    
    <!-- Top Navigation Bar -->
    <header class="fixed top-0 left-0 w-full z-40 flex justify-between items-center px-8 py-4 bg-surface/80 backdrop-blur-xl border-b border-outline-variant/10">
        <div class="flex items-center gap-3">
            <span class="material-symbols-outlined text-primary text-3xl">fluid_med</span>
            <span class="font-headline-md text-headline-md font-bold text-primary">My AI Companion</span>
        </div>
        <div class="flex items-center gap-4">
            <button onclick="window.location.href='/chat'" class="p-2 rounded-full hover:bg-surface-variant/20 transition-colors text-primary" title="Back to Chat">
                <span class="material-symbols-outlined">forum</span>
            </button>
            <button onclick="window.location.href='/auth/logout'" class="p-2 rounded-full hover:bg-error-container/20 text-error transition-colors" title="Sign Out">
                <span class="material-symbols-outlined">logout</span>
            </button>
        </div>
    </header>

    <!-- Side Navigation Bar (Hidden on Mobile) -->
    <aside class="fixed left-0 top-0 h-full hidden md:flex flex-col p-6 z-30 bg-surface-container border-r border-outline-variant/30 w-64 pt-24 rounded-r-xl">
        <div class="flex flex-col gap-6">
            <div class="px-4">
                <h3 class="font-headline-md text-primary">My Workspace</h3>
                <p class="text-on-surface-variant font-label-sm text-label-sm">Settings Mode</p>
            </div>
            <nav class="flex flex-col gap-2">
                <a class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:bg-surface-variant/50 rounded-lg transition-all duration-200" href="/chat">
                    <span class="material-symbols-outlined">chat</span>
                    <span class="font-label-sm text-label-sm">Current Chat</span>
                </a>
                <a class="flex items-center gap-3 px-4 py-3 bg-primary-container text-on-primary-container rounded-lg font-bold transition-all duration-200" href="/account">
                    <span class="material-symbols-outlined">settings</span>
                    <span class="font-label-sm text-label-sm">Settings</span>
                </a>
            </nav>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="min-h-screen pt-32 pb-16 px-4 md:pl-72 flex items-center justify-center relative">
        <!-- Background Decor -->
        <div class="absolute inset-0 overflow-hidden pointer-events-none">
            <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-primary/5 blur-[120px]"></div>
            <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-secondary/5 blur-[120px]"></div>
        </div>

        <div id="cursor-glow"></div>

        <!-- Account Configuration Card -->
        <div class="relative w-full max-w-2xl bg-surface-container-high/40 glass-panel rounded-xl overflow-hidden shadow-2xl transition-all duration-500 hover:shadow-primary/5">
            
            <!-- Card Header -->
            <div class="p-8 md:p-10 text-center border-b border-outline-variant/10">
                <h1 class="font-headline-lg text-headline-lg mb-2">Your Account Profile</h1>
                <p class="text-on-surface-variant font-body-md text-body-md">Manage your connection settings and data.</p>
            </div>

            <!-- Profile Info Form -->
            <form action="/account/update" method="POST" class="p-8 md:p-10 flex flex-col items-center gap-6">
                <div class="relative group">
                    <div class="w-32 h-32 rounded-full p-1 bg-gradient-to-tr from-primary to-secondary">
                        <img id="avatar-preview" class="w-full h-full object-cover rounded-full border-4 border-surface-container-high" src="{{ user.avatar_url or 'https://lh3.googleusercontent.com/aida-public/AB6AXuCSEkmmpfhz2RW-n5NMsFRT7ZMTNaBmoLdT8bxrCGAJP1k2ZnX4ZFuDCkTqINrUNux_1-qJoM_8tTC3hzoPREZj5VtbtgBnHJc7XmySi-wN6f59XG4ybOuqTNGk68K5Lba6hS7ck6HwbmgpGpgXQFFWmlKJnOn4wEtidVeC9GtJUk82zroHKDF9L8eOmQB1fQYcQffx5nnmzBiMvTnuVRO1S3XArBsAee0i3DcCfttZc-vkurpzybcuYSGsoVUQIsrNfNwvim5Cepcf' }}"/>
                    </div>
                </div>

                <div class="w-full space-y-4 max-w-md">
                    <div>
                        <label class="font-label-sm text-label-sm text-on-surface-variant block mb-1">Display Name</label>
                        <input type="text" name="display_name" class="w-full bg-surface-container rounded-full h-12 px-6 border border-outline-variant/20 focus:border-primary focus:ring-0 text-on-surface font-body-md" value="{{ user.display_name }}" required/>
                    </div>
                    <div>
                        <label class="font-label-sm text-label-sm text-on-surface-variant block mb-1">Email Address</label>
                        <input type="email" class="w-full bg-surface-container/50 rounded-full h-12 px-6 border border-outline-variant/10 text-on-surface/60 font-body-md cursor-not-allowed" value="{{ user.email }}" readonly/>
                    </div>
                    <div>
                        <label class="font-label-sm text-label-sm text-on-surface-variant block mb-1">Avatar Image URL</label>
                        <input type="text" id="avatar-input" name="avatar_url" class="w-full bg-surface-container rounded-full h-12 px-6 border border-outline-variant/20 focus:border-primary focus:ring-0 text-on-surface font-body-md" value="{{ user.avatar_url }}" oninput="updateAvatarPreview(this.value)"/>
                    </div>
                    <div class="flex justify-center pt-2">
                        <button type="submit" class="px-6 py-2 bg-primary text-on-primary rounded-full font-bold shadow-md hover:shadow-lg transition-all active:scale-95">
                            Save Profile Changes
                        </button>
                    </div>
                </div>
            </form>

            <!-- Configuration Options -->
            <div class="px-8 md:px-10 py-6 flex flex-col gap-10 border-t border-outline-variant/10">
                <!-- Theme Selector -->
                <div class="flex flex-col gap-4">
                    <label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-2">
                        <span class="material-symbols-outlined text-sm">palette</span>
                        App Theme Preference
                    </label>
                    <div class="bg-surface-container-lowest p-1.5 rounded-lg flex gap-1">
                        <button id="theme-btn-light" onclick="setAppTheme('light')" class="flex-1 py-2.5 rounded-lg font-label-md text-label-md transition-all">
                            Light
                        </button>
                        <button id="theme-btn-dark" onclick="setAppTheme('dark')" class="flex-1 py-2.5 rounded-lg font-label-md text-label-md transition-all">
                            Dark
                        </button>
                        <button id="theme-btn-system" onclick="setAppTheme('system')" class="flex-1 py-2.5 rounded-lg font-label-md text-label-md transition-all">
                            System Default
                        </button>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <button onclick="clearChatHistory()" class="px-6 py-4 rounded-full border border-tertiary text-tertiary font-bold flex items-center justify-center gap-2 hover:bg-tertiary/10 transition-all active:scale-95">
                        <span class="material-symbols-outlined">mop</span>
                        Clear Active Chat Sessions
                    </button>
                    <button onclick="window.location.href='/chat'" class="px-6 py-4 rounded-full bg-gradient-to-r from-primary-container to-secondary-container text-on-primary-container font-bold flex items-center justify-center gap-2 shadow-lg shadow-primary/20 active:scale-95 transition-all">
                        <span class="material-symbols-outlined">forum</span>
                        Back to Chat
                    </button>
                </div>
            </div>

            <!-- Footer Action -->
            <div class="p-8 md:p-10 border-t border-outline-variant/10 flex justify-center">
                <button onclick="window.location.href='/auth/logout'" class="flex items-center gap-2 text-error hover:bg-error-container/20 px-6 py-3 rounded-lg transition-colors font-label-md text-label-md">
                    <span class="material-symbols-outlined">logout</span>
                    Sign Out of Session
                </button>
            </div>
        </div>
    </main>

    <script>
        // Update avatar image live preview
        function updateAvatarPreview(url) {
            const preview = document.getElementById('avatar-preview');
            if (url) {
                preview.src = url;
            } else {
                preview.src = 'https://lh3.googleusercontent.com/aida-public/AB6AXuCSEkmmpfhz2RW-n5NMsFRT7ZMTNaBmoLdT8bxrCGAJP1k2ZnX4ZFuDCkTqINrUNux_1-qJoM_8tTC3hzoPREZj5VtbtgBnHJc7XmySi-wN6f59XG4ybOuqTNGk68K5Lba6hS7ck6HwbmgpGpgXQFFWmlKJnOn4wEtidVeC9GtJUk82zroHKDF9L8eOmQB1fQYcQffx5nnmzBiMvTnuVRO1S3XArBsAee0i3DcCfttZc-vkurpzybcuYSGsoVUQIsrNfNwvim5Cepcf';
            }
        }

        // Render active states for theme buttons
        function updateThemeButtons(activeTheme) {
            const lightBtn = document.getElementById('theme-btn-light');
            const darkBtn = document.getElementById('theme-btn-dark');
            const systemBtn = document.getElementById('theme-btn-system');

            [lightBtn, darkBtn, systemBtn].forEach(btn => {
                btn.className = "flex-1 py-2.5 rounded-lg text-on-surface-variant font-label-md text-label-md hover:bg-surface-variant/30 transition-colors";
            });

            const activeBtn = document.getElementById(`theme-btn-${activeTheme}`);
            if (activeBtn) {
                activeBtn.className = "flex-1 py-2.5 rounded-lg bg-surface-variant text-primary font-bold font-label-md text-label-md shadow-sm";
            }
        }

        // Set theme preference
        function setAppTheme(theme) {
            updateThemePreference(theme);
            updateThemeButtons(theme);
        }

        async function clearChatHistory() {
            if (confirm("Are you sure you want to clear your chat logs? This cannot be undone.")) {
                try {
                    const response = await fetch('/api/clear_chat', { method: 'POST' });
                    if (response.ok) {
                        alert("Chat history cleared successfully.");
                    } else {
                        alert("Failed to clear chat history.");
                    }
                } catch(e) {
                    console.error(e);
                    alert("Error clearing history.");
                }
            }
        }

        // Initialize view
        document.addEventListener('DOMContentLoaded', () => {
            const currentTheme = window.userThemePreference || localStorage.getItem('theme_preference') || 'system';
            updateThemeButtons(currentTheme);
        });

        // Mouse glow cursor position sync
        document.addEventListener('mousemove', (e) => {
            const glow = document.getElementById('cursor-glow');
            if (glow) {
                glow.style.left = e.clientX + 'px';
                glow.style.top = e.clientY + 'px';
            }
        });
    </script>
</body>
</html>
